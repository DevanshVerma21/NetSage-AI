[project]
name = "netsage-ai"
version = "0.1.0"
description = "AI-assisted network troubleshooting helper with mandatory human review"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live provider tests are deselected by default so the suite never touches the network,
# even on a machine that happens to have a key configured. Run them with: -m live
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits the real LLM provider over the network (opt-in, excluded by default)",
]
